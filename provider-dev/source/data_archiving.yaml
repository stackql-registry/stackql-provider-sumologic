openapi: 3.0.0
info:
  title: Sumo Logic Data Archiving API
  description: Data archiving destinations (AWS S3 buckets for archived logs).
  version: 1.0.0
paths:
  /v1/dataarchiving/destinations:
    get:
      tags:
        - dataArchivingManagement
      summary: Get all data archiving destinations.
      description: Get a list of all data archiving destinations configured for installed collectors.
      operationId: getDataArchivingDestinations
      parameters:
        - name: limit
          in: query
          description: Limit the number of destinations returned in the response. The number of destinations returned may be less than the `limit`.
          required: false
          schema:
            maximum: 100
            minimum: 1
            type: integer
            format: int32
            default: 10
        - name: token
          in: query
          description: Continuation token to get the next page of results. A page object with the next continuation token is returned in the response body. Subsequent GET requests should specify the continuation token to get the next page of results. `token` is set to null when no more pages are left.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of all data archiving destinations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDataArchivingDestinationsResponse'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - dataArchivingManagement
      summary: Create a data archiving destination.
      description: Create a new data archiving destination.
      operationId: createDataArchivingDestination
      parameters: []
      requestBody:
        description: Parameters to create a new data archiving destination.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataArchivingDestinationRequest'
        required: true
      responses:
        '200':
          description: The data archiving destination has been created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataArchivingDestination'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/dataarchiving/destinations/{id}:
    get:
      tags:
        - dataArchivingManagement
      summary: Get a data archiving destination.
      description: Get a data archiving destination by the given identifier.
      operationId: getDataArchivingDestination
      parameters:
        - name: id
          in: path
          description: Identifier of the data archiving destination to return.
          required: true
          schema:
            type: string
          example: 1
      responses:
        '200':
          description: Data archiving destination object requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataArchivingDestination'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - dataArchivingManagement
      summary: Update a data archiving destination.
      description: Update a data archiving destination by the given identifier.
      operationId: updateDataArchivingDestination
      parameters:
        - name: id
          in: path
          description: Identifier of the data archiving destination to update.
          required: true
          schema:
            type: string
          example: 1
      requestBody:
        description: Object with the updated parameters.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDataArchivingDestinationRequest'
        required: true
      responses:
        '200':
          description: The data archiving destination has been updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataArchivingDestination'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - dataArchivingManagement
      summary: Delete a data archiving destination.
      description: Delete an existing data archiving destination with the given identifier.
      operationId: deleteDataArchivingDestination
      parameters:
        - name: id
          in: path
          description: Identifier of the data archiving destination to delete.
          required: true
          schema:
            type: string
          example: 1
      responses:
        '204':
          description: The data archiving destination has been deleted.
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    GetDataArchivingDestinationsResponse:
      type: object
      properties:
        nextToken:
          type: string
          description: Next continuation token.
          example: VEZuRU4veXF2UWFCUURYSDNQUzJxWlpRRUsvTlBieXA
        data:
          type: array
          description: List of data archiving destinations.
          items:
            $ref: '#/components/schemas/DataArchivingDestination'
    ErrorResponse:
      required:
        - errors
        - id
      type: object
      properties:
        id:
          type: string
          description: An identifier for the error; this is unique to the specific API request.
          example: IUUQI-DGH5I-TJ045
        errors:
          type: array
          description: A list of one or more causes of the error.
          example:
            - code: auth:password_too_short
              message: Your password was too short.
            - code: auth:password_character_classes
              message: Your password did not contain any non-alphanumeric characters
          items:
            $ref: '#/components/schemas/ErrorDescription'
    CreateDataArchivingDestinationRequest:
      required:
        - destinationName
        - destinationConfig
      type: object
      properties:
        destinationName:
          maxLength: 128
          minLength: 1
          type: string
          description: Name of the data archiving destination.
          example: my-archive-destination
        destinationConfig:
          $ref: '#/components/schemas/DataArchivingDestinationConfig'
    DataArchivingDestination:
      required:
        - destinationName
        - destinationConfig
        - createdAt
        - createdBy
        - modifiedAt
        - modifiedBy
        - id
      type: object
      properties:
        destinationName:
          maxLength: 128
          minLength: 1
          type: string
          description: Name of the data archiving destination.
          example: my-archive-destination
        destinationConfig:
          $ref: '#/components/schemas/DataArchivingDestinationConfig'
        createdAt:
          type: string
          description: Creation timestamp in UTC in [RFC3339](https://tools.ietf.org/html/rfc3339) format.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        createdBy:
          type: string
          description: Identifier of the user who created the resource.
          example: 0000000006743FDD
        modifiedAt:
          type: string
          description: Last modification timestamp in UTC.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        modifiedBy:
          type: string
          description: Identifier of the user who last modified the resource.
          example: 0000000006743FE8
        id:
          type: string
          description: Unique identifier for the data archiving destination.
          example: '1'
    UpdateDataArchivingDestinationRequest:
      required:
        - destinationConfig
        - destinationName
      type: object
      properties:
        destinationName:
          maxLength: 128
          minLength: 1
          type: string
          description: Name of the data archiving destination.
          example: my-archive-destination
        destinationConfig:
          $ref: '#/components/schemas/UpdateDataArchivingDestinationConfigRequest'
      description: Request object to update a data archiving destination.
    ErrorDescription:
      required:
        - code
        - message
      type: object
      properties:
        code:
          type: string
          description: An error code describing the type of error.
          example: auth:password_too_short
        message:
          type: string
          description: A short English-language description of the error.
          example: Your password was too short.
        detail:
          type: string
          description: An optional fuller English-language description of the error.
          example: Your password was 5 characters long, the minimum length is 12 characters. See http://example.com/password for more information.
        meta:
          type: string
          description: An optional list of metadata about the error. (opaque JSON object)
          example:
            minLength: 12
            actualLength: 5
    BaseDataArchivingDestination:
      required:
        - destinationName
      type: object
      properties:
        destinationName:
          maxLength: 128
          minLength: 1
          type: string
          description: Name of the data archiving destination.
          example: my-archive-destination
    DataArchivingDestinationConfig:
      required:
        - destinationType
      type: object
      properties:
        destinationType:
          pattern: ^(S3|Syslog|Hitachi|RestAPI)$
          type: string
          description: Type of the data archiving destination.
          example: S3
          x-pattern-message: should be 'S3', 'Syslog', 'Hitachi' or 'RestAPI'
      discriminator:
        propertyName: destinationType
        mapping:
          S3: '#/components/schemas/S3ArchivingDestinationConfig'
          Syslog: '#/components/schemas/SyslogArchivingDestinationConfig'
          Hitachi: '#/components/schemas/HitachiArchivingDestinationConfig'
          RestAPI: '#/components/schemas/RestAPIArchivingDestinationConfig'
    MetadataModel:
      required:
        - createdAt
        - createdBy
        - modifiedAt
        - modifiedBy
      type: object
      properties:
        createdAt:
          type: string
          description: Creation timestamp in UTC in [RFC3339](https://tools.ietf.org/html/rfc3339) format.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        createdBy:
          type: string
          description: Identifier of the user who created the resource.
          example: 0000000006743FDD
        modifiedAt:
          type: string
          description: Last modification timestamp in UTC.
          format: date-time
          example: '2018-10-16T09:10:00.000Z'
        modifiedBy:
          type: string
          description: Identifier of the user who last modified the resource.
          example: 0000000006743FE8
    UpdateDataArchivingDestinationConfigRequest:
      required:
        - destinationType
      type: object
      properties:
        destinationType:
          pattern: ^(S3|Syslog|Hitachi|RestAPI)$
          type: string
          description: Type of the data archiving destination.
          example: S3
          x-pattern-message: should be 'S3', 'Syslog', 'Hitachi' or 'RestAPI'
      discriminator:
        propertyName: destinationType
        mapping:
          S3: '#/components/schemas/UpdateS3ArchivingDestinationConfigRequest'
          Syslog: '#/components/schemas/UpdateSyslogArchivingDestinationConfigRequest'
          Hitachi: '#/components/schemas/UpdateHitachiArchivingDestinationConfigRequest'
          RestAPI: '#/components/schemas/UpdateRestAPIArchivingDestinationConfigRequest'
